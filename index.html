<style>
:root{--bg:#f6f7f9;--card:#fff;--border:#e3e5e8;--text:#1c1c1e;--muted:#6b7280;--blue:#2563eb;--blue-bg:#eff6ff;--warn:#a16207;}
*{box-sizing:border-box} body{margin:0;font:15px/1.65 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif;color:var(--text);background:var(--bg)}
.wrap{max-width:720px;margin:0 auto;padding:28px 16px 60px} h1{font-size:24px;margin:0 0 4px}.lead{color:var(--muted);margin:0 0 20px;font-size:14px}
.tips,.panel{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px 18px}.tips{margin-bottom:20px;font-size:13.5px;line-height:1.7}.tips b{color:var(--blue)}
.step{font-size:13px;font-weight:700;color:var(--blue);margin:0 0 5px}.field{margin-top:14px}.field:first-of-type{margin-top:0}.panel label{display:block;font-size:13px;font-weight:600;margin:0 0 5px;color:var(--muted)}
.panel select{width:100%;padding:10px 11px;border:1px solid var(--border);border-radius:8px;font:inherit;background:#fff}
.hint{color:var(--muted);font-size:12.5px;margin:5px 0 0}.hint.warn{color:var(--warn)} button,a.btn{font:inherit;cursor:pointer;border:1px solid var(--border);background:#fff;border-radius:8px;padding:9px 14px;color:var(--text);text-decoration:none;display:inline-block}
a.btn.teacher{display:block;text-align:center;margin-top:16px;color:var(--muted);font-size:13.5px;background:none}a.btn.teacher:hover{color:var(--blue);background:#fff}
.paperlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:8px;margin-top:8px}
.paperlink{display:block;text-align:center;padding:10px 8px;border:1px solid var(--border);border-radius:9px;background:#fff;color:var(--text);text-decoration:none;font-size:14px;font-weight:600}
.paperlink:hover{border-color:var(--blue);color:var(--blue);background:var(--blue-bg)}
footer{color:var(--muted);font-size:12px;text-align:center;margin-top:24px}
</style>

<main class="wrap">
  <h1>Look for unfamiliar words</h1>
  <p class="lead">选择考试或文本，点开对应试卷即可开始标记生词。</p>
  <div class="tips"><b>学生识别码：</b>只填姓名拼音首字母，不留空格，例如李晓明填写 <b>LXM</b>；发送给老师时，系统会自动加上当时的日期和时间。第一次打开试卷时填一次即可，之后在同一台设备上打开其他试卷会自动记住，不用重复填写。</div>
  <section class="panel" aria-label="选择试卷">
    <div class="field"><p class="step">1. 考试 / 文本</p><label for="exam">选择类别</label><select id="exam"></select></div>
    <div class="field"><p class="step">2. 试卷</p><p class="hint" id="paperHint"></p><div class="paperlist" id="paperList"></div></div>
  </section>

function currentExam(){ return catalog.exams.find(item => item.id === $('exam').value); }
