<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Look for unfamiliar words</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--border:#e3e5e8;--text:#1c1c1e;--muted:#6b7280;--blue:#2563eb;--blue-bg:#eff6ff;--warn:#a16207;}
*{box-sizing:border-box} body{margin:0;font:15px/1.65 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif;color:var(--text);background:var(--bg)}
.wrap{max-width:720px;margin:0 auto;padding:28px 16px 60px} h1{font-size:24px;margin:0 0 4px}.lead{color:var(--muted);margin:0 0 20px;font-size:14px}
.tips,.panel{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px 18px}.tips{margin-bottom:20px;font-size:13.5px}.tips b{color:var(--blue)}
.step{font-size:13px;font-weight:700;color:var(--blue);margin:0 0 5px}.field{margin-top:14px}.field:first-of-type{margin-top:0}.panel label{display:block;font-size:13px;font-weight:600;margin:0 0 5px;color:var(--muted)}
.panel input,.panel select{width:100%;padding:10px 11px;border:1px solid var(--border);border-radius:8px;font:inherit;background:#fff}.panel select:disabled{color:#9ca3af;background:#f9fafb}
.hint{color:var(--muted);font-size:12.5px;margin:5px 0 0}.hint.warn{color:var(--warn)} button,a.btn{font:inherit;cursor:pointer;border:1px solid var(--border);background:#fff;border-radius:8px;padding:9px 14px;color:var(--text);text-decoration:none;display:inline-block}
button.primary{background:var(--blue);border-color:var(--blue);color:#fff;width:100%;margin-top:18px;font-weight:600}button.primary:hover{background:#1d4ed8}button.primary:disabled{cursor:not-allowed;background:#93b4f7;border-color:#93b4f7}
.result{margin-top:12px;font-size:13.5px;background:var(--blue-bg);border-radius:9px;padding:10px 13px;word-break:break-all;display:none}.result.show{display:block}.result a{color:var(--blue)}
a.btn.teacher{display:block;text-align:center;margin-top:16px;color:var(--muted);font-size:13.5px;background:none}a.btn.teacher:hover{color:var(--blue);background:#fff}
#toast{position:fixed;left:50%;top:16px;transform:translateX(-50%);background:#111827;color:#fff;padding:8px 14px;border-radius:8px;font-size:13.5px;display:none;z-index:10}footer{color:var(--muted);font-size:12px;text-align:center;margin-top:24px}
</style>
</head>
<body>
<main class="wrap">
  <h1>Look for unfamiliar words</h1>
  <p class="lead">选择考试或文本、试卷和学生识别码，生成可直接发给学生的链接。</p>
  <div class="tips"><b>学生识别码：</b>姓名拼音缩写 + 生日月日，例如李小明生日 9 月 20 日，填写 <b>LXM0920</b>。</div>
  <section class="panel" aria-label="生成学生链接">
    <div class="field"><p class="step">1. 考试 / 文本</p><label for="exam">选择类别</label><select id="exam"></select></div>
    <div class="field"><p class="step">2. 试卷</p><label for="paper">选择试卷</label><select id="paper" disabled></select><p class="hint" id="paperHint"></p></div>
    <div class="field"><p class="step">3. 学生识别码</p><label for="studentId">拼音缩写 + 生日 MMDD</label><input id="studentId" placeholder="例如 LXM0920" maxlength="14" autocomplete="off"><p class="hint" id="studentHint">格式：2–10 位大写拼音缩写 + 有效月日。</p></div>
    <button class="primary" id="go" disabled>生成并复制链接</button>
    <div class="result" id="result" aria-live="polite"></div>
  </section>
  <a class="btn teacher" href="%E6%A0%87%E8%AE%B0%E5%8D%95%E8%AF%8D%E7%BB%93%E6%9E%9C-%E8%80%81%E5%B8%88%E7%99%BB%E5%BD%95%E7%89%88%E6%9C%AC.html">🔒 教师登录 · 查看标记结果 →</a>
  <footer>仅供课堂使用 · 更新于 2026-09-20</footer>
</main>
<div id="toast" role="status"></div>
<script>
const catalog = {"site_title": "Look for unfamiliar words", "exams": [{"id": "gaokao", "name": "高考", "papers": []}, {"id": "cet4", "name": "CET-4 真题", "papers": []}, {"id": "cet6", "name": "CET-6 真题", "papers": []}, {"id": "kaoyan1", "name": "考研英语一", "papers": []}, {"id": "kaoyan2", "name": "考研英语二", "papers": []}, {"id": "unlock2-rw", "name": "Unlock Level 2 R&W", "papers": []}, {"id": "unlock3-rw", "name": "Unlock Level 3 R&W", "papers": []}, {"id": "unlock4-rw", "name": "Unlock Level 4 R&W", "papers": []}, {"id": "unlock5-rw", "name": "Unlock Level 5 R&W", "papers": []}]};
const $ = id => document.getElementById(id);
function toast(text){ const el=$('toast'); el.textContent=text; el.style.display='block'; clearTimeout(toast.timer); toast.timer=setTimeout(()=>el.style.display='none',2200); }
function esc(text){ return String(text).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function validStudentId(value){ return /^[A-Z]{2,10}(0[1-9]|1[0-2])(0[1-9]|[12]\d|3[01])$/.test(value); }
function currentExam(){ return catalog.exams.find(item => item.id === $('exam').value); }
function currentPaper(){ const exam=currentExam(); return exam && (exam.papers || []).find(item => item.file === $('paper').value); }
function updateButton(){ const id=$('studentId').value.trim(), paper=currentPaper(); const valid=validStudentId(id); $('studentHint').className='hint' + (id && !valid ? ' warn' : ''); $('studentHint').textContent=id && !valid ? '请输入如 LXM0920 的识别码：缩写必须大写，生日为四位 MMDD。' : '格式：2–10 位大写拼音缩写 + 有效月日。'; $('go').disabled=!(paper && valid); }
function fillPapers(){ const exam=currentExam(), select=$('paper'), hint=$('paperHint'); const papers=(exam && exam.papers) || []; select.innerHTML=''; if(!papers.length){ select.innerHTML='<option>暂无可用试卷</option>'; select.disabled=true; hint.textContent='该类别的试卷目录尚未添加。'; hint.className='hint warn'; } else { select.disabled=false; select.innerHTML='<option value="">请选择试卷</option>'+papers.map(p=>'<option value="'+esc(p.file)+'">'+esc(p.label)+'</option>').join(''); hint.textContent=''; hint.className='hint'; } $('result').className='result'; $('result').innerHTML=''; updateButton(); }
function init(){ $('exam').innerHTML='<option value="">请选择考试或文本</option>'+catalog.exams.map(e=>'<option value="'+esc(e.id)+'">'+esc(e.name)+'</option>').join(''); }
$('exam').addEventListener('change', fillPapers); $('paper').addEventListener('change', updateButton); $('studentId').addEventListener('input', e=>{ e.target.value=e.target.value.toUpperCase().replace(/[^A-Z0-9]/g,''); updateButton(); });
$('go').addEventListener('click', async ()=>{ const paper=currentPaper(), id=$('studentId').value.trim(); if(!paper || !validStudentId(id)) return updateButton(); const url=new URL(paper.file, location.href); url.searchParams.set('s', id); const text=url.href, box=$('result'); box.className='result show'; box.innerHTML='<a href="'+esc(text)+'" target="_blank" rel="noopener">'+esc(text)+'</a>'; try{ await navigator.clipboard.writeText(text); toast('链接已生成并复制'); }catch(e){ const ta=document.createElement('textarea'); ta.value=text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); toast('链接已生成；请确认已复制'); } });
init();
</script>
</body>
</html>
